name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Contrôler TypeScript
        run: pnpm run typecheck

      - name: Exécuter les tests unitaires
        run: pnpm run test

      - name: Valider les données historiques relues
        run: pnpm run historical:validate

      - name: Vérifier les données historiques générées
        run: |
          pnpm run historical:generate
          git diff --exit-code -- content/generated

      - name: Vérifier la compatibilité historique
        run: pnpm run historical:check

      - name: Vérifier la provenance cartographique
        run: pnpm run map:sources:check

      - name: Construire l’application
        run: pnpm run build

      - name: Vérifier l’installation PWA
        run: pnpm run pwa:check
